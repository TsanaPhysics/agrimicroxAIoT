<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR 3D ArUco Book — จุลชีววิทยาการเกษตรและเทคโนโลยี AIoT (มรภ.รำไพพรรณี)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="aruco_dictionary_6x6.js"></script>
  <script src="aruco_tracker.js"></script>

  <style>
    /* =========================================================
       1. Base Reset & Fullscreen Viewport
       ========================================================= */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: #020813;
      color: #f8fafc;
      font-family: 'Prompt', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #webgl-canvas-container {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(circle at 50% 35%, #071e16 0%, #020813 90%);
      transition: background 0.3s ease;
    }
    body.ar-active #webgl-canvas-container {
      background: transparent !important;
    }

    #camera-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      display: none;
      background: #000;
    }

    /* =========================================================
       2. Top Bar & Holographic Status Badges
       ========================================================= */
    #topHeader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      padding: 14px 18px;
      z-index: 40;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(2, 8, 19, 0.88) 0%, rgba(2, 8, 19, 0) 100%);
      pointer-events: none;
    }
    .header-left {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-pill {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
    }
    .book-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .book-subtitle {
      font-size: 0.68rem;
      color: #94a3b8;
    }
    .header-right {
      pointer-events: auto;
      display: flex;
      gap: 8px;
    }
    .top-btn {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }
    .top-btn:active {
      transform: scale(0.95);
    }

    /* =========================================================
       3. AR Reticle & Laser Optical Scanner
       ========================================================= */
    #ar-reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(320px, 76vw);
      height: min(320px, 76vw);
      border: 2px dashed rgba(16, 185, 129, 0.5);
      border-radius: 20px;
      z-index: 30;
      display: none;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
      overflow: hidden;
    }
    .reticle-corner { position: absolute; width: 22px; height: 22px; border: 3px solid #10b981; }
    .rc-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
    .rc-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 12px 0 0; }
    .rc-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 12px; }
    .rc-br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 12px 0; }
    
    .reticle-scan-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #10b981, #fff, #10b981, transparent);
      box-shadow: 0 0 16px #10b981;
      animation: scanLaser 2.2s infinite ease-in-out;
    }
    @keyframes scanLaser {
      0% { top: 4%; opacity: 0.2; }
      50% { top: 94%; opacity: 1; }
      100% { top: 4%; opacity: 0.2; }
    }
    #ar-reticle.locked {
      border-color: #10b981 !important;
      box-shadow: 0 0 45px rgba(16, 185, 129, 0.7) !important;
    }
    #ar-reticle.locked .reticle-scan-line { display: none; }

    .reticle-tag {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(2, 8, 19, 0.85);
      border: 1px solid rgba(16, 185, 129, 0.5);
      color: #f1f5f9;
      font-size: 0.72rem;
      padding: 5px 12px;
      border-radius: 999px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* =========================================================
       4. Lab Selector Capsule (Top Center)
       ========================================================= */
    #labCapsule {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 45;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 6px 14px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    #capsuleText {
      font-size: 0.76rem;
      font-weight: 500;
      color: #ecfdf5;
    }
    #labCapsule i {
      color: #34d399;
      font-size: 0.7rem;
    }

    /* Modal Lab Picker */
    #labPickerModal {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      background: #0f172a;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-title { font-size: 1.05rem; font-weight: 600; color: #fff; }
    .modal-close { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }
    .lab-option-btn {
      width: 100%;
      text-align: left;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      color: #f1f5f9;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
    }
    .lab-option-btn:hover, .lab-option-btn.active {
      background: rgba(16, 185, 129, 0.18);
      border-color: #10b981;
    }
    .lab-num-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #10b981;
      color: #020813;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* =========================================================
       5. Bangchak-Style Curved Bottom Navigation
       ========================================================= */
    #mobileBottomNav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 82px;
      z-index: 50;
      display: flex;
      align-items: flex-end;
      pointer-events: none;
    }
    .nav-bg-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      filter: drop-shadow(0 -4px 16px rgba(0,0,0,0.6));
    }
    .nav-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 64px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 16px;
      pointer-events: auto;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.68rem;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.2s;
    }
    .nav-item i { font-size: 1.15rem; }
    .nav-item.active { color: #10b981; }

    /* Center 3D Floating Action Gem */
    .gem-btn-container {
      position: relative;
      top: -18px;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gem-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #34d399 0%, #059669 65%, #047857 100%);
      border: 3px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      font-size: 1.35rem;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.5), inset 0 2px 4px rgba(255,255,255,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .gem-btn:active {
      transform: scale(0.92);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }
    body.ar-active .gem-btn {
      background: radial-gradient(circle at 35% 30%, #f43f5e 0%, #e11d48 65%, #be123c 100%);
      box-shadow: 0 8px 24px rgba(244, 63, 94, 0.6);
    }

    /* =========================================================
       6. Translucent Side Drawers (DATA & CTRL)
       ========================================================= */
    .side-drawer {
      position: fixed;
      top: 60px;
      bottom: 90px;
      width: min(320px, 85vw);
      background: rgba(2, 8, 19, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 60;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
    }
    #drawerLeft { left: 0; border-left: none; border-radius: 0 20px 20px 0; transform: translateX(-105%); }
    #drawerRight { right: 0; border-right: none; border-radius: 20px 0 0 20px; transform: translateX(105%); }
    .side-drawer.open { transform: translateX(0) !important; }

    .drawer-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .telemetry-card {
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 12px;
    }
    .t-label { font-size: 0.72rem; color: #94a3b8; margin-bottom: 4px; }
    .t-val { font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 600; color: #38bdf8; }
    .t-sub { font-size: 0.65rem; color: #64748b; margin-top: 2px; }

    .ctrl-slider-group {
      margin-bottom: 12px;
    }
    .ctrl-label {
      font-size: 0.74rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .ctrl-slider {
      width: 100%;
      accent-color: #10b981;
    }

    /* Molecular Sidecar Quick Link Pill */
    .sidecar-pill {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.5);
      color: #a5b4fc;
      font-size: 0.7rem;
      padding: 6px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      cursor: pointer;
    }
    .sidecar-pill:hover { background: rgba(99, 102, 241, 0.3); }

    /* Sound chime toggle */
    #audioCue { display: none; }
  </style>
</head>
<body>

  <!-- Top Header Bar -->
  <header id="topHeader">
    <div class="header-left">
      <div class="brand-pill">
        <i class="fa-solid fa-cube"></i> AR 3D ARUCO
      </div>
      <div>
        <div class="book-title">จุลชีววิทยาการเกษตรและเทคโนโลยี AIoT</div>
        <div class="book-subtitle">คู่มือปฏิบัติการเสมือนจริง 8 ปฏิบัติการ • มรภ.รำไพพรรณี</div>

  <!-- Lab Selector Capsule -->
  <div id="labCapsule">

  </div>

  <!-- Video Feed & Three.js Canvas -->
  <video id="camera-video" autoplay playsinline webkit-playsinline muted></video>
  <div id="webgl-canvas-container"></div>

  <!-- Left Drawer: Telemetry DATA -->
  <div class="side-drawer" id="drawerLeft">
    <div class="drawer-title"><i class="fa-solid fa-chart-line"></i> TELEMETRY & SENSORS</div>

    </div>
    <div class="sidecar-pill" id="btnOpenSidecarDirect">
      <i class="fa-solid fa-atom"></i> เปิด Biomolecular Structure Viewer
    </div>
  </div>

  <!-- Right Drawer: 3D Lab Controls CTRL -->
  <div class="side-drawer" id="drawerRight">
    <div class="drawer-title"><i class="fa-solid fa-sliders"></i> LAB PARAMETERS</div>

      <!-- Dynamic Lab Controls -->
    </div>
    <button class="top-btn" style="width: 100%; justify-content: center;" id="btnResetView">

    </button>
  </div>

  <!-- Lab Picker Modal -->
  <div id="labPickerModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title"><i class="fa-solid fa-book-bookmark"></i> เลือกปฏิบัติการที่ 1--8</div>
        <button class="modal-close" id="btnCloseModal">&times;</button>
      </div>
      <div id="labListContainer">
        <!-- Rendered from LABS -->
      </div>
    </div>
  </div>

  <!-- Bangchak Bottom Navigation -->
  <nav id="mobileBottomNav">
    <svg class="nav-bg-svg" viewBox="0 0 400 82" preserveAspectRatio="none">
      <defs>
        <linearGradient id="navGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0b172a" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#020813" stop-opacity="0.98"/>
        </linearGradient>
      </defs>
      <!-- Bangchak Recessed Notch Path for 58px Action Gem -->
      <path d="M 0,22 L 140,22 C 160,22 165,62 200,62 C 235,62 240,22 260,22 L 400,22 L 400,82 L 0,82 Z" fill="url(#navGrad)"/>
    </svg>
    <div class="nav-content">
      <button class="nav-item" id="btnNavData">
        <i class="fa-solid fa-chart-pie"></i>
        <span>DATA</span>
      </button>
      <button class="nav-item" id="btnNavMarker">
        <i class="fa-solid fa-qrcode"></i>
        <span>MARKER</span>

      <div class="gem-btn-container">

      <button class="nav-item" id="btnNavRotate">

      <button class="nav-item" id="btnNavCtrl">
        <i class="fa-solid fa-sliders"></i>
        <span>CTRL</span>
      </button>
    </div>
  </nav>

  <!-- =========================================================
       7. WebAR & Three.js 3D Interactive Engine Script
       ========================================================= -->

    // Lab 2: Rhizobium & Legume Nodule + Leghemoglobin
    function createLab2Model() {
      const g = new THREE.Group();

      // Main Root
      const rootMat = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.8 });
      const mainRoot = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.04, 3.2, 16), rootMat);
      g.add(mainRoot);

      // Lateral roots & Nodules
      const noduleMat = new THREE.MeshStandardMaterial({ color: 0xf472b6, roughness: 0.5 }); // Pinkish legume nodule
      const noduleCutMat = new THREE.MeshStandardMaterial({ color: 0xe11d48, roughness: 0.3 }); // Active red leghemoglobin

      for (let i = 0; i < 9; i++) {
        const y = -1.2 + (i * 0.3);
        const angle = i * 1.6;
        const branch = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.02, 0.8, 12), rootMat);
        branch.position.set(Math.cos(angle)*0.25, y, Math.sin(angle)*0.25);
        branch.rotation.z = Math.PI/3 * (i % 2 === 0 ? 1 : -1);
        g.add(branch);

        // Nodule Cluster
        const nod = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), (i === 4 ? noduleCutMat : noduleMat));
        nod.position.set(Math.cos(angle)*0.55, y, Math.sin(angle)*0.55);
        g.add(nod);
      }

      // Floating Stylized Protein Ribbon (Leghemoglobin 1GDJ)
      const proteinGroup = new THREE.Group();
      proteinGroup.position.set(1.1, 0.4, 0);
      
      const helixMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3, metalness: 0.2 });
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.4, -0.5, 0),
        new THREE.Vector3(-0.2, 0.2, 0.3),
        new THREE.Vector3(0.1, 0.5, -0.2),
        new THREE.Vector3(0.4, 0.1, 0.2),
        new THREE.Vector3(0.2, -0.4, -0.3),
        new THREE.Vector3(-0.1, -0.2, 0.1)
      ], true);
      const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 64, 0.06, 8, true), helixMat);
      proteinGroup.add(tube);

      // Central Heme Iron Sphere
      const heme = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.8, roughness: 0.2 }));
      proteinGroup.add(heme);
      g.add(proteinGroup);

      return g;
    }

    // Lab 7: Soil DNA Extraction & Double Helix
    function createLab7Model() {
      const g = new THREE.Group();

      // 1. Bead Beater Tube (Left)
      const tubeMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, roughness: 0.2 });
      const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.3, 1.6, 24), tubeMat);
      tube.position.set(-1.1, 0, 0);
      g.add(tube);

      const capMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.4 });
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.25, 24), capMat);
      cap.position.set(-1.1, 0.9, 0);
      g.add(cap);

      // Soil Lysis Beads Inside Tube
      for (let i = 0; i < 18; i++) {
        const bead = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.8 }));
        bead.position.set(-1.1 + (Math.random()-0.5)*0.35, -0.6 + (Math.random()-0.5)*0.4, (Math.random()-0.5)*0.35);
        g.add(bead);
      }

      // 2. 3D Rotating DNA Double Helix (Center-Right)
      const dnaGroup = new THREE.Group();
      dnaGroup.position.set(0.6, 0, 0);

      const backboneMat1 = new THREE.MeshStandardMaterial({ color: 0x06b6d4, roughness: 0.3 });
      const backboneMat2 = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3 });
      const basePairMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.4 });

      const turns = 3;
      const height = 2.6;
      const radius = 0.55;

      for (let i = 0; i < 28; i++) {
        const t = (i / 28) * Math.PI * 2 * turns;
        const y = -height/2 + (i / 28) * height;

        const x1 = Math.cos(t) * radius;
        const z1 = Math.sin(t) * radius;
        const s1 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), backboneMat1);
        s1.position.set(x1, y, z1);
        dnaGroup.add(s1);

        const x2 = Math.cos(t + Math.PI) * radius;
        const z2 = Math.sin(t + Math.PI) * radius;
        const s2 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), backboneMat2);
        s2.position.set(x2, y, z2);
        dnaGroup.add(s2);

        // Base pair connecting bar
        const rbar = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, radius * 2, 8), basePairMat);
        rbar.position.set(0, y, 0);
        rbar.rotation.y = -t;
        rbar.rotation.z = Math.PI / 2;
        dnaGroup.add(rbar);
      }
      g.add(dnaGroup);

      return g;
    }

      } else if (lab.id === 5) {
        html = `
          <div class="telemetry-card">
            <div class="t-label">ROOT INTERSECTIONS</div>
            <div class="t-val">100 / 100 points</div>
          </div>
          <div class="telemetry-card" style="margin-top: 8px;">
            <div class="t-label">AMF COLONIZATION</div>
            <div class="t-val">68.0 %</div>
            <div class="t-sub">Arbuscules + Vesicles observed</div>
          </div>
        `;
      } else if (lab.id === 6) {
        html = `
          <div class="telemetry-card">
            <div class="t-label">VIABLE CELL COUNT</div>
            <div class="t-val">4.5 x 10^8 CFU/g</div>
            <div class="t-sub">DOA Standard: >= 1.0 x 10^8 CFU/g</div>
          </div>
          <div class="telemetry-card" style="margin-top: 8px;">
            <div class="t-label">CONTAMINATION (MACCONKEY)</div>
            <div class="t-val" style="color: #10b981;">0 CFU (PASS)</div>
            <div class="t-sub">No E. coli / Coliforms detected</div>
          </div>
        `;
      } else if (lab.id === 7) {
        html = `
          <div class="telemetry-card">
            <div class="t-label">NANODROP CONCENTRATION</div>
            <div class="t-val">142.6 ng/uL</div>
          </div>
          <div class="telemetry-card" style="margin-top: 8px;">
            <div class="t-label">PURITY RATIO (A260 / A280)</div>
            <div class="t-val">1.85 (Pure DNA)</div>
            <div class="t-sub">Optimal Range: 1.80 -- 2.00</div>
          </div>
        `;
      } else if (lab.id === 8) {
        html = `
          <div class="telemetry-card">
            <div class="t-label">PCR DIAGNOSTIC BAND</div>
            <div class="t-val">450 bp (Ypt1 +)</div>
            <div class="t-sub">Phytophthora palmivora confirmed</div>
          </div>
          <div class="telemetry-card" style="margin-top: 8px;">
            <div class="t-label">OPENCV SEVERITY (DSI)</div>
            <div class="t-val">28.5 % Lesion Area</div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    // Dynamic Controls Renderer
    function renderControls(lab) {
      const container = document.getElementById('controlsContent');
      container.innerHTML = `
        <div class="ctrl-slider-group">
          <div class="ctrl-label"><span>ความเข้มแสง (Studio Intensity)</span><span id="txtLightVal">1.2x</span></div>
          <input type="range" class="ctrl-slider" id="sliderLight" min="0.4" max="2.5" step="0.1" value="1.2">
        </div>
        <div class="ctrl-slider-group">
          <div class="ctrl-label"><span>ขนาดโมเดล 3D (Scale)</span><span id="txtScaleVal">1.0x</span></div>
          <input type="range" class="ctrl-slider" id="sliderScale" min="0.5" max="2.0" step="0.05" value="1.0">
        </div>
        <div class="ctrl-slider-group">
          <div class="ctrl-label"><span>หมุนแกน Y (Rotation)</span><span id="txtRotVal">0 deg</span></div>
          <input type="range" class="ctrl-slider" id="sliderRot" min="0" max="360" step="1" value="0">
        </div>
      `;

      document.getElementById('sliderLight').addEventListener('input', (e) => {
        const v = parseFloat(e.target.value);
        keyLight.intensity = v;
        document.getElementById('txtLightVal').textContent = v.toFixed(1) + 'x';
      });

      document.getElementById('sliderScale').addEventListener('input', (e) => {
        const v = parseFloat(e.target.value);
        labModelGroup.scale.set(v, v, v);
        document.getElementById('txtScaleVal').textContent = v.toFixed(2) + 'x';
      });

      document.getElementById('sliderRot').addEventListener('input', (e) => {
        const v = parseFloat(e.target.value);
        labModelGroup.rotation.y = THREE.MathUtils.degToRad(v);
        document.getElementById('txtRotVal').textContent = Math.round(v) + ' deg';
      });
    }

    // =========================================================
    // Camera & ArUco Real-time Tracking
    // =========================================================
    let arucoTrackerInstance = null;
    try {
      if (typeof ArUcoTracker !== 'undefined') {
        arucoTrackerInstance = new ArUcoTracker({ width: 480, height: 360, markerPhysicalSize: 1.0 });
        if (typeof ARUCO_DICT_6X6_MAP !== 'undefined') {
          arucoTrackerInstance.setDictionary(ARUCO_DICT_6X6_MAP);
        }
      }
    } catch(e) { console.warn('ArUco init:', e); }

    const videoEl = document.getElementById('camera-video');
    const reticleEl = document.getElementById('ar-reticle');

    async function toggleARCamera() {
      if (!isARActive) {
        // Start Camera
        try {
          let stream = null;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
            });
          } catch(e) {
            stream = await navigator.mediaDevices.getUserMedia({ video: true });
          }
          videoEl.srcObject = stream;
          videoEl.style.display = 'block';
          reticleEl.style.display = 'block';
          document.body.classList.add('ar-active');
          await videoEl.play();
          isARActive = true;
          document.getElementById('reticleTag').innerHTML = `<i class="fa-solid fa-camera"></i> ส่อง Marker แล็บ ${LABS[currentLabIdx].id} ในหนังสือ`;
        } catch(err) {
          alert('ไม่สามารถเปิดกล้องได้ (โปรดเข้าผ่าน HTTPS หรือ localhost): ' + err.message);
        }
      } else {
        // Stop Camera
        if (videoEl.srcObject) {
          videoEl.srcObject.getTracks().forEach(t => t.stop());
          videoEl.srcObject = null;
        }
        videoEl.style.display = 'none';
        reticleEl.style.display = 'none';
        document.body.classList.remove('ar-active');
        isARActive = false;
        labModelGroup.position.set(0, 0, 0);
      }
    }

    // Animation Loop
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (isAutoRotating && !isARActive) {
        labModelGroup.rotation.y += 0.012;
      }

      // ArUco tracking frame sampling
      if (isARActive && arucoTrackerInstance && videoEl.readyState >= 2) {
        const markers = arucoTrackerInstance.detect(videoEl);
        if (markers && markers.length > 0) {
          const m = markers[0];
          reticleEl.classList.add('locked');
          // Switch to matched lab if ArUco matches
          if (m.id >= 0 && m.id < LABS.length && m.id !== currentLabIdx) {
            loadLabModel(m.id);
          }
        } else {
          reticleEl.classList.remove('locked');
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // =========================================================
    // UI Event Handlers & Modal
    // =========================================================
    document.getElementById('btnGemAR').addEventListener('click', toggleARCamera);

    // Modal Lab Picker
    const modal = document.getElementById('labPickerModal');
    document.getElementById('labCapsule').addEventListener('click', () => {
      renderLabList();
      modal.style.display = 'flex';
    });
    document.getElementById('btnCloseModal').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    function renderLabList() {
      const c = document.getElementById('labListContainer');
      c.innerHTML = LABS.map((lab, idx) => `
        <div class="lab-option-btn ${idx === currentLabIdx ? 'active' : ''}" onclick="selectLab(${idx})">
          <div class="lab-num-badge">${lab.id}</div>
          <div style="flex: 1;">
            <div style="font-weight: 600; font-size: 0.84rem;">${lab.title}</div>
            <div style="font-size: 0.68rem; color: #94a3b8;">ArUco ID: ${lab.aruco_id} • ${lab.biomolecule}</div>
          </div>
        </div>
      `).join('');
    }

    window.selectLab = function(idx) {
      loadLabModel(idx);
      modal.style.display = 'none';
    };

    // Drawers
    const drawerL = document.getElementById('drawerLeft');
    const drawerR = document.getElementById('drawerRight');
    document.getElementById('btnNavData').addEventListener('click', () => {
      drawerL.classList.toggle('open');
      drawerR.classList.remove('open');
    });
    document.getElementById('btnNavCtrl').addEventListener('click', () => {
      drawerR.classList.toggle('open');
      drawerL.classList.remove('open');
    });

    document.getElementById('btnNavRotate').addEventListener('click', () => {
      isAutoRotating = !isAutoRotating;
      document.getElementById('btnNavRotate').classList.toggle('active', isAutoRotating);
    });

    document.getElementById('btnResetView').addEventListener('click', () => {
      camera.position.set(0, 1.8, 4.2);
      controls.target.set(0, 0, 0);
      labModelGroup.rotation.set(0, 0, 0);
    });

    // Marker preview modal
    document.getElementById('btnNavMarker').addEventListener('click', () => {
      const lab = LABS[currentLabIdx];
      window.open(lab.targetCard, '_blank');
    });

    document.getElementById('btnHelp').addEventListener('click', () => {
      alert("วิธีใช้งาน AR 3D ARUCO Book:\n1. เปิดหน้าคู่มือปฏิบัติการในหนังสือ หรือเปิดการ์ด ArUco Marker\n2. กดปุ่มไอคอนกล้องสีเขียวตรงกลางแถบด้านล่าง\n3. ส่องกล้องไปที่ภาพ ArUco Marker ในหน้าแล็บนั้นๆ\n4. โมเดล 3 มิติจะปรากฏขึ้นมาพร้อมข้อมูล Telemetry และการคำนวณสด!");
    });

    // Sidecar Biomolecular Structure Viewer Link
    document.getElementById('btnSidecar').addEventListener('click', () => {
      const lab = LABS[currentLabIdx];
      alert(`โมเลกุลชีวภาพสำหรับแล็บนี้: ${lab.biomolecule} (PDB ID: ${lab.pdb})\nคุณสามารถเปิดสำรวจผ่าน Biomolecular Structure Viewer ในหน้าจอข้างเคียง`);
    });
    document.getElementById('btnOpenSidecarDirect').addEventListener('click', () => {
      const lab = LABS[currentLabIdx];
      alert(`[Biomolecular Structure Viewer](sidecar://science/biomolecular_structure_viewer/ui.html)\nโมเลกุล: ${lab.biomolecule} (${lab.pdb})`);
    });

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initial Load: Lab 1
    loadLabModel(0);
  </script>
</body>
</html>
